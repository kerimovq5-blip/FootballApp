# Hər PR-da və main-ə hər push-da: SwiftLint, build və unit testlər.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # GitHub-da "Run workflow" düyməsi ilə əllə işə salmaq üçün

# Eyni branch-a yeni push gələndə köhnə, hələ bitməmiş yoxlamanı dayandır.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # Xəbərdarlıqlar PR-da kodun yanında görünür. Yalnız "error" job-u qırmızı edir.
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SCHEME: FootballApp
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # Secrets.swift git-də yoxdur. Testlər şəbəkəyə getmir, ona görə boş açar kifayətdir.
      - name: Create Secrets.swift
        run: |
          cat > FootballApp/Core/Secrets.swift <<'EOF'
          enum Secrets {
              static let apiKey = ""
          }
          EOF

      # Firebase və RxSwift hər dəfə yenidən yüklənməsin.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FootballApp.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Test uğursuz olsa, nəticəni GitHub-dan yükləyib Xcode-da açmaq olar.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
