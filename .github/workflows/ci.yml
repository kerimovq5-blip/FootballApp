# Hər PR-da və main-ə hər push-da: SwiftLint, build və unit testlər.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # GitHub-da "Run workflow" düyməsi ilə əllə işə salmaq üçün

# Eyni branch-a yeni push gələndə köhnə, hələ bitməmiş yoxlamanı dayandır.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # Xəbərdarlıqlar PR-da kodun yanında görünür. Yalnız "error" job-u qırmızı edir.
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SCHEME: FootballApp
    steps:
      - uses: actions/checkout@v4

      # Runner-in default Xcode-u işlədilir (sabit yol obraz yenilənəndə sınır).
      - name: Show Xcode version
        run: xcodebuild -version

      # Simulator adı/versiyası sərt yazılmır: runner-də olan ən yeni iOS-dakı ilk iPhone seçilir.
      - name: Pick iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(x) for x in re.findall(r"\d+", runtime.split("iOS")[-1])]
          for runtime in sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator $UDID"
          echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"

      # Secrets.swift git-də yoxdur. Testlər şəbəkəyə getmir, ona görə boş açar kifayətdir.
      - name: Create Secrets.swift
        run: |
          cat > FootballApp/Core/Secrets.swift <<'EOF'
          enum Secrets {
              static let apiKey = ""
          }
          EOF

      # Firebase və RxSwift hər dəfə yenidən yüklənməsin.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project FootballApp.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Test uğursuz olsa, nəticəni GitHub-dan yükləyib Xcode-da açmaq olar.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
